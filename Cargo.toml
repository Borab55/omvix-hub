[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/backend-windows",
    "crates/backend-linux",
    "crates/cli",
    "crates/app",
]

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Borab55"]
repository = "https://github.com/Borab55/hp-omen-hub-lite"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
directories = "5"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
nvml-wrapper = "0.10"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.31"
tray-icon = "0.19"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
